schema_version: 1

context:
  name: opentelemetry-instrumentation-groq
  version: "0.63.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/opentelemetry_instrumentation_groq-${{ version }}.tar.gz
  sha256: e8efe8c362b2ac8b767178af06277f68bcef9f0b73eb40654e7909557632ef00

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - opentelemetry-api >=1.38.0,<2.0.0
    - opentelemetry-instrumentation >=0.59b0
    - opentelemetry-semantic-conventions >=0.59b0
    - opentelemetry-semantic-conventions-ai >=0.5.1,<0.6.0
  run_constraints:
    - groq >=0.18.0

tests:
  - requirements:
      run:
        - python ${{ python_min }}.*
        - groq
        - pip
    script:
      - python -c "import opentelemetry.instrumentation.groq"
      - pip check

about:
  summary: OpenTelemetry Groq instrumentation
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://www.traceloop.com/openllmetry
  repository: https://github.com/traceloop/openllmetry
  documentation: https://www.traceloop.com/docs/openllmetry/introduction

extra:
  recipe-maintainers:
    - timkpaine
